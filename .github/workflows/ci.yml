# CI: lint, typecheck, and test on every push and pull request.
#
# Both suites run. The logic tests (jest.logic.config.js) run in plain Node;
# the component tests (jest-expo) mount every screen against a stubbed API and
# are the only thing that catches a render error — the failure that blanks the
# app on a release build. They were previously left to be "run locally / on
# demand", which in practice means never, and the screens they cover are the
# ones a customer orders through. They take a few seconds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (logic)
        run: npm test

      - name: Test (components)
        run: npm run test:components
